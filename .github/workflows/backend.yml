name: Backend — Build, Deploy & Notify

on:
  push:
    branches: [dev]
    paths:
      - '**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/genetics-backend
  CONTAINER_NAME: genetics-backend

jobs:
  # ── Job 1: Build & Push image ──────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get short SHA
        id: meta
        run: echo "version=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 2: Deploy lên server ───────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            docker pull ${{ env.IMAGE_NAME }}:latest

            # Tạo network nếu chưa có
            docker network create genetics-network 2>/dev/null || true

            # Đảm bảo db containers cùng network
            docker network connect genetics-network genetics-mysql 2>/dev/null || true
            docker network connect genetics-network genetics-mongodb 2>/dev/null || true
            docker network connect genetics-network genetics-redis 2>/dev/null || true

            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm ${{ env.CONTAINER_NAME }} || true

            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --network genetics-network \
              --restart unless-stopped \
              -p 3000:3000 \
              --env-file /home/${{ secrets.SERVER_USER }}/genetics/.env \
              -v /home/${{ secrets.SERVER_USER }}/genetics-s3:/app/genetics-s3 \
              ${{ env.IMAGE_NAME }}:latest

            docker image prune -f

  # ── Job 3: Telegram Notification ──────────────────────
  notify:
    name: Telegram Notification
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()

    steps:
      - name: Notify Success
        if: needs.deploy.result == 'success'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          message: |
            ✅ <b>[BACKEND] Deploy thành công!</b>

            🌿 <b>Branch:</b> ${{ github.ref_name }}
            👤 <b>By:</b> ${{ github.actor }}
            📝 <b>Commit:</b> ${{ github.event.head_commit.message }}
            🏷 <b>Tag:</b> <code>${{ needs.build.outputs.image_tag }}</code>

            🔗 <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">Xem chi tiết</a>

      - name: Notify Failure
        if: needs.build.result == 'failure' || needs.deploy.result == 'failure'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          message: |
            ❌ <b>[BACKEND] Deploy thất bại!</b>

            🌿 <b>Branch:</b> ${{ github.ref_name }}
            👤 <b>By:</b> ${{ github.actor }}
            📝 <b>Commit:</b> ${{ github.event.head_commit.message }}

            🔍 Build: ${{ needs.build.result }}
            🚀 Deploy: ${{ needs.deploy.result }}

            🔗 <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">Xem log lỗi</a>